<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wisbordjes</title>
<style>
:root{--ink:#1f2340;--mute:#6b6f92;--primary:#5458d6;--primary-d:#4246b8;--coral:#ff6a55;--pink:#ff9aa8;--yellow:#ffc93c;--blue:#5b94c8;--green:#14b789;--violet:#a78bfa;--lav:#cfc6f7;--line:#e6e2f4;--red:#ff4d4f;--sh:0 10px 30px rgba(60,50,120,.15);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:
 radial-gradient(circle 17vmin at 0 100%,var(--violet) 99%,transparent 100%),
 radial-gradient(circle 40vmin at 0 0,var(--blue) 99%,transparent 100%),
 radial-gradient(circle 42vmin at 100% 0,var(--coral) 99%,transparent 100%),
 radial-gradient(circle 40vmin at 0 100%,var(--pink) 99%,transparent 100%),
 radial-gradient(circle 40vmin at 100% 100%,var(--yellow) 99%,transparent 100%),
 #f4f1fe;background-attachment:fixed}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
input,select{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;outline:none}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #5458d633}
button{cursor:pointer;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;transition:background .15s,box-shadow .15s}
button:hover{background:#f1eeff;border-color:var(--lav)}
button.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px #5458d655}
button.on:hover{background:var(--primary-d)}
button#go,button#new{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 12px #14b78955}
button#go:hover,button#new:hover{background:#0fa377}
#cl.on,#fz.on{background:var(--coral);border-color:var(--coral);box-shadow:0 4px 12px #ff6a5555}
#cl.on:hover,#fz.on:hover{background:#f0553f}
#fz{padding:7px 10px;font-size:.95rem;line-height:1}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:var(--primary);font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}
/* startpagina */
.c{max-width:520px;margin:0 auto;padding:32px 16px}
.c h1{text-align:center;margin:8px 0 0;font-size:2rem}
.card{background:#fff;border-radius:20px;padding:20px;margin:18px 0;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh)}
.card h2{margin:0;font-size:1.15rem}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:#f7f5ff}
/* leerling */
.st{position:relative;height:100dvh;display:flex;flex-direction:column;padding:12px;gap:12px}
.bar{display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap;background:#fff;border-radius:18px;box-shadow:var(--sh)}
.bar .sp{flex:1}
.bar select{border-radius:999px;padding:8px 14px;font-weight:600}
.bar small{color:var(--mute);font-weight:600}
.sws{display:flex;gap:6px;align-items:center;padding:0 4px}
.sw{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw:hover{border-color:#fff;transform:scale(1.12)}
.sw.sel{box-shadow:0 0 0 2.5px var(--primary)}
.sw.plus{display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:#fff;font-weight:700;position:relative;overflow:hidden;cursor:pointer}
.sw.plus input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
#wrap{flex:1;min-height:0;display:flex;overflow:auto}
#box{margin:auto;flex:none;position:relative;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 14px 40px rgba(60,50,120,.25)}
#cv{display:block;background:#fff;touch-action:none;cursor:crosshair}
#box textarea{position:absolute;margin:0;padding:0;border:1.5px dashed var(--primary);background:#fff8;color:#000;resize:none;outline:none;overflow:hidden;font-family:sans-serif;line-height:1.2}
#msg{position:fixed;inset:0;background:rgba(84,88,214,.94);color:#fff;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:1.3rem;font-weight:600;z-index:20}
#msg button{color:var(--primary)}
/* docent */
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;margin:12px;background:#fff;border-radius:18px;box-shadow:var(--sh)}
.tb b{font-size:1.1rem}
.code{font-weight:800;letter-spacing:.12em;background:var(--coral);color:#fff;padding:4px 12px;border-radius:8px}
#cnt{margin-left:auto;color:var(--mute);font-weight:600}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:4px 12px 16px}
.cd{position:relative;background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--sh)}
.cd canvas{display:block;width:100%;background:#fff}
.cd .ft{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:6px}
.cd .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd .bt{display:flex;gap:4px}
.cd .bt button{padding:4px 10px}
.cd.off canvas{opacity:.35}
.tpill{background:var(--yellow);color:var(--ink);font-weight:800;border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums}
.tpill.done{background:var(--coral);color:#fff}
.tm{display:flex;gap:6px;align-items:center}
#tmin{width:84px;padding:8px 10px}
.st.locked .bar button:not(#fs):not(.keep),.st.locked .bar select,.st.locked .bar .sw{opacity:.4;pointer-events:none}
.st.locked #cv{cursor:not-allowed}
.warn{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:20px;box-shadow:0 2px 8px #ff4d4f77;display:none;align-items:center;justify-content:center}
.cd.away .warn{display:flex}
.hide .nm{visibility:hidden}
.shield canvas{visibility:hidden}
.shield .cd{min-height:160px;background:linear-gradient(135deg,#efeaff,#ffeef0)}
.shield .cd::after{content:"Afgeschermd";position:absolute;top:38%;left:0;right:0;text-align:center;color:var(--mute);font-weight:700}
#zoom{position:fixed;inset:0;background:rgba(31,35,64,.82);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
#zoom .zb{display:flex;flex-direction:column;gap:10px}
#zoom .zh{display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:1.1em;min-height:38px}
#zoom .zx{color:var(--ink)}
#zoom canvas{width:min(92vw,calc((100dvh - 110px) * 1.6));height:auto;background:#fff;border-radius:16px;box-shadow:0 20px 60px #0006}
#set{position:fixed;inset:0;background:rgba(31,35,64,.82);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
#set .sb{background:#fff;border-radius:20px;padding:20px;width:min(780px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #0006}
#set .sh{display:flex;justify-content:space-between;align-items:center;font-size:1.2rem}
#set h3{margin:8px 0 0}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filebtn{cursor:pointer;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600}
.filebtn:hover{background:#f1eeff}
.filebtn.on{background:var(--primary);border-color:var(--primary);color:#fff}
#bgprev{width:min(560px,100%);aspect-ratio:12/7;background:#fff;border:1.5px solid var(--line);border-radius:12px;touch-action:none;cursor:grab}
.gc{border:1.5px dashed var(--lav);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:52px;cursor:pointer}
.gc b{margin-right:8px}
.gc>i{margin-left:auto;font-style:normal}
.bdg{display:inline-flex;align-items:center;gap:6px;background:#efeaff;color:var(--ink);border-radius:999px;padding:3px 10px;font-weight:600;font-size:.9rem}
.bdg.me{background:var(--primary);color:#fff}
.bdg.pick{outline:3px solid var(--yellow)}
.bdg.off{opacity:.45}
.bdg.away{background:#ffe3e0;color:#b3261e}
.bdg i{font-style:normal;opacity:.6}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.zm{display:flex;gap:4px}
.cd .bdgs{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px}
.hide .bn{visibility:hidden}
#info{position:absolute;left:22px;top:86px;z-index:6;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none;max-width:calc(100% - 44px)}
#info small{background:rgba(255,255,255,.88);padding:3px 10px;border-radius:999px;font-weight:600;color:var(--mute);font-size:.8rem}
#info .chips{background:rgba(255,255,255,.92);padding:4px 10px;border-radius:999px;box-shadow:var(--sh)}
.tb b{max-width:150px;overflow:hidden;text-overflow:ellipsis}
#pager{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:8;display:flex;gap:6px;align-items:center;background:#fff;border-radius:999px;padding:6px 10px;box-shadow:0 10px 30px rgba(60,50,120,.28)}
#pager span{font-weight:700;padding:0 6px;white-space:nowrap}
#pager .pgs{width:1px;height:22px;background:var(--line);padding:0}
#grid{padding-bottom:84px}
#slst{display:flex;flex-direction:column;gap:6px}
.slr{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.slr.edit{border-color:var(--primary);background:#f4f2ff}
.slr canvas{width:96px;height:56px;border-radius:6px;border:1px solid var(--line);flex:none}
.sln{flex:1;display:flex;flex-direction:column;line-height:1.25}
.sln em{font-style:normal;background:var(--green);color:#fff;border-radius:999px;padding:0 8px;font-size:.75rem;margin-left:6px}
.sln small{color:var(--mute)}
.slb{display:flex;gap:4px}
.slb button{padding:4px 9px}
/* Compacte werkbalken: één rij op een scherm van 13 inch (knoppen ca. 10% kleiner) */
.bar,.tb{flex-wrap:nowrap;gap:5px;padding:8px 12px;font-size:.9rem;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar,.tb::-webkit-scrollbar{display:none}
.bar>*,.tb>*{flex:none}
.bar button,.tb button,.bar select,.tb .filebtn{font-size:.9rem;padding:7px 12px;white-space:nowrap}
.bar select{padding:7px 10px}
.bar .sw{width:24px;height:24px;padding:0}
.bar .sws{gap:5px;padding:0 2px}
.bar .sp{flex:1 1 4px;min-width:4px}
.bar>small{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem}
.bar .chips,.tb .tm{flex-wrap:nowrap}
.bar .bdg{padding:2px 8px;font-size:.8rem}
.tb b{font-size:1rem;white-space:nowrap}
.tb a{white-space:nowrap}
.code{padding:3px 9px;font-size:.95rem;letter-spacing:.08em}
#cnt{white-space:nowrap}
#cnt.bad{color:var(--red)}
#cnt.bad::before{content:'⚠ '}
.tpill{padding:5px 11px;font-size:.9rem;white-space:nowrap}
#tmin{width:60px;padding:6px 8px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const W = 1200, H = 700;
const $ = s => document.querySelector(s), app = $('#app');
const ls = {
  g: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  s: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const rnd = n => Array.from({ length: n }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random() * 32 | 0]).join('');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Tekent een bord (strokes + teksten) op een canvas met pixelbreedte w
// ---------- Tekenen: achtergrond + lagen (elke leerling heeft een eigen laag) ----------
const DIM = { individual: [1200, 700], groups: [2400, 1400], placemat: [1600, 1000] }; // logische bordgrootte per werkvorm
const ZORD = [0, 2, 1, 3];                 // placemat: vak per groepslid = boven, onder, rechts, links
const ZNAME = ['boven', 'rechts', 'onder', 'links'];
const ENV = { dm: DIM.individual, bg: { type: 'white' }, img: null };
const matGeom = (w, h) => ({ cx: w / 2, cy: h / 2, rw: w * .15, rh: h * .15 });
function zonePoly(i, w, h) {
  const { cx, cy, rw, rh } = matGeom(w, h);
  return [[[0, 0], [w, 0], [cx + rw, cy - rh], [cx - rw, cy - rh]], [[w, 0], [w, h], [cx + rw, cy + rh], [cx + rw, cy - rh]],
          [[0, h], [w, h], [cx + rw, cy + rh], [cx - rw, cy + rh]], [[0, 0], [0, h], [cx - rw, cy + rh], [cx - rw, cy - rh]]][i];
}
function zoneAt(x, y, w, h) {
  const { cx, cy, rw, rh } = matGeom(w, h);
  if (Math.abs(x - cx) <= rw && Math.abs(y - cy) <= rh) return 'c';
  const dx = (x - cx) / (w / 2), dy = (y - cy) / (h / 2);
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy < 0 ? 0 : 2);
}
function bgDraw(x, o) {
  const [w, h] = o.dm, b = o.bg || {};
  x.lineWidth = 1.5; x.strokeStyle = '#c9d3ee'; x.fillStyle = '#b4bde0';
  if (b.type === 'lines') for (let y = 80; y < h; y += 40) { x.beginPath(); x.moveTo(0, y); x.lineTo(w, y); x.stroke(); }
  if (b.type === 'grid') { x.beginPath(); for (let i = 40; i < w; i += 40) { x.moveTo(i, 0); x.lineTo(i, h); } for (let j = 40; j < h; j += 40) { x.moveTo(0, j); x.lineTo(w, j); } x.stroke(); }
  if (b.type === 'dots') for (let i = 40; i < w; i += 40) for (let j = 40; j < h; j += 40) { x.beginPath(); x.arc(i, j, 2.4, 0, 7); x.fill(); }
  if (b.type === 'image' && o.img) {
    const k = Math.max(w / o.img.width, h / o.img.height) * (b.z || 1), iw = o.img.width * k, ih = o.img.height * k;
    x.drawImage(o.img, (w - iw) / 2 + (b.x || 0) * w, (h - ih) / 2 + (b.y || 0) * h, iw, ih);
  }
  if (o.mat) {
    const { cx, cy, rw, rh } = matGeom(w, h);
    x.fillStyle = 'rgba(255,201,60,.16)'; x.fillRect(cx - rw, cy - rh, rw * 2, rh * 2);
    x.strokeStyle = '#7c6fd6'; x.lineWidth = 4; x.strokeRect(cx - rw, cy - rh, rw * 2, rh * 2);
    x.beginPath(); [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([p, q]) => { x.moveTo(cx + p * rw, cy + q * rh); x.lineTo(cx + p * cx, cy + q * cy); }); x.stroke();
    x.fillStyle = 'rgba(70,70,130,.5)'; x.font = '700 34px system-ui,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('Samen', cx, cy);
    const nm = o.names || [];
    if (nm[0]) x.fillText(nm[0], cx, (cy - rh) / 2);
    if (nm[1]) x.fillText(nm[1], w - (cx - rw) / 2, cy);
    if (nm[2]) x.fillText(nm[2], cx, h - (cy - rh) / 2);
    if (nm[3]) x.fillText(nm[3], (cx - rw) / 2, cy);
  }
}
function strokes(x, b) {
  x.lineCap = x.lineJoin = 'round';
  for (const s of b.s || []) {
    const p = s.p;
    x.globalCompositeOperation = s.m === 'er' ? 'destination-out' : 'source-over'; // gum wist alleen de eigen laag
    x.globalAlpha = s.m === 'hl' ? .4 : 1; x.strokeStyle = s.c; x.lineWidth = s.w;
    x.beginPath(); x.moveTo(p[0], p[1]);
    if (p.length < 4) x.lineTo(p[0] + .1, p[1]);
    for (let i = 2; i < p.length; i += 2) x.lineTo(p[i], p[i + 1]);
    x.stroke();
  }
  x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  for (const t of b.t || []) {
    x.fillStyle = t.c; x.font = t.s + 'px sans-serif'; x.textBaseline = 'top'; x.textAlign = 'start';
    t.v.split('\n').forEach((l, i) => x.fillText(l, t.x, t.y + i * t.s * 1.2));
  }
}
const OFF = document.createElement('canvas');
// o = { dm, bg, img, mat, names, layers: [{ data, zone, center }] }
function render(cv, pw, o) {
  const [w, h] = o.dm, sc = pw / w;
  cv.width = pw; cv.height = Math.round(h * sc);
  const x = cv.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height);
  x.save(); x.scale(sc, sc); bgDraw(x, o); x.restore();
  OFF.width = cv.width; OFF.height = cv.height;
  const y = OFF.getContext('2d');
  for (const L of o.layers) {
    y.setTransform(1, 0, 0, 1, 0, 0); y.clearRect(0, 0, OFF.width, OFF.height);
    y.save(); y.scale(sc, sc);
    if (L.zone != null) { // placemat: een laag blijft binnen het eigen vak (en het midden als dat vrij is)
      y.beginPath(); zonePoly(L.zone, w, h).forEach(([a, c], i) => i ? y.lineTo(a, c) : y.moveTo(a, c)); y.closePath();
      if (L.center) { const g = matGeom(w, h); y.rect(g.cx - g.rw, g.cy - g.rh, g.rw * 2, g.rh * 2); }
      y.clip();
    }
    strokes(y, L.data || {}); y.restore();
    x.drawImage(OFF, 0, 0);
  }
}
// Slides: elke sessie heeft een lijst slides (met achtergrond) en een huidige slide
const newId = () => 's' + rnd(5);
function slidesOf(row) {
  const list = Array.isArray(row.slides) && row.slides.length ? row.slides : [{ id: 's1', bg: row.bg || { type: 'white' } }];
  return { list, cur: list.find(x => x.id === row.cur) || list[0] };
}
const draw = (cv, b, w) => render(cv, w, { dm: ENV.dm, bg: ENV.bg, img: ENV.img, layers: [{ data: b }] });

// ====== INSTELLEN: kopieer deze twee waarden uit Supabase (Project Settings > API) ======
const SUPABASE_URL = 'https://mrntifcakwmwdlywaqgt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ji_-mqWB7EFTtvxxS3xTKA_XJNSEX1D';
// ===========================================================================================

const sb = (typeof supabase !== 'undefined' && !SUPABASE_URL.includes('JOUW-')) ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const qs = new URLSearchParams(location.search);
const cleanCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
const fatal = t => { app.innerHTML = `<div class="c"><div class="card">${t}</div></div>`; };
let uid = null, skew = 0;
const nowS = () => Date.now() + skew; // tijd volgens de server
const fmt = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return String(t / 60 | 0).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
async function syncClock() {
  try {
    const t0 = Date.now(), { data } = await sb.rpc('server_now'), t1 = Date.now();
    if (data) skew = Date.parse(data) - (t0 + t1) / 2;
  } catch {}
}

async function start() {
  if (!sb) return fatal('Vul eerst <b>SUPABASE_URL</b> en <b>SUPABASE_KEY</b> in bovenin index.html in.');
  let { data: { session } } = await sb.auth.getSession();
  if (!session) {
    const r = await sb.auth.signInAnonymously();
    if (r.error) return fatal('Inloggen mislukt: ' + esc(r.error.message) + '<br>Staat anoniem inloggen aan in Supabase en is de limiet niet bereikt?');
    session = r.data.session;
  }
  uid = session.user.id;
  await syncClock();
  if (qs.get('s')) return student(cleanCode(qs.get('s')));
  if (qs.get('t')) return teacher(cleanCode(qs.get('t')));
  home();
}

/* ---------- Startpagina ---------- */
async function home() {
  app.innerHTML = `<div class="c"><h1>Wisbordjes</h1>
  <div class="card"><h2>Leerling</h2>
    <input id="n" placeholder="Je naam" maxlength="30">
    <input id="k" placeholder="Sessiecode" maxlength="8" style="text-transform:uppercase">
    <button id="go" class="on">Meedoen</button></div>
  <div class="card"><h2>Docent</h2>
    <div class="row"><input id="sn" placeholder="Naam sessie, bijv. klas 2A"><button id="new" class="on">Start sessie</button></div>
    <div id="list">Laden…</div></div></div>`;
  const n = $('#n'), k = $('#k');
  k.oninput = () => { const v = ls.g('wb_name_' + cleanCode(k.value)); if (v) n.value = v; };
  $('#go').onclick = () => {
    const c = cleanCode(k.value), nm = n.value.trim();
    if (!c || !nm) return;
    ls.s('wb_name_' + c, nm); location.href = '?s=' + c;
  };
  $('#new').onclick = async () => {
    const name = $('#sn').value.trim() || 'Nieuwe sessie';
    for (let i = 0; i < 5; i++) {
      const code = rnd(5), { error } = await sb.from('sessions').insert({ code, name });
      if (!error) return location.href = '?t=' + code;
      if (error.code !== '23505') return alert('Sessie maken mislukt: ' + error.message);
    }
  };

/* ---------- Leerling ---------- */
async function student(code) {

    <select id="sz"><option value="3">Dun</option><option value="6" selected>Middel</option><option value="12">Dik</option></select>
    <button id="undo">↶</button><button id="clr" title="Alles wissen">🗑 Alles</button>
    <span id="tpill" class="tpill" hidden></span>
    <span class="sp"></span><button id="fs" title="Volledig scherm" aria-label="Volledig scherm">⛶</button></div>
    <div id="info"><small>${esc(name)} · ${esc(code)}</small><small id="sn" hidden></small><span id="grp" class="chips" hidden></span></div>
    <div id="wrap"><div id="box"><canvas id="cv"></canvas></div></div></div>
    <div id="msg">Verbinden…</div>`;
  const cv = $('#cv'), box = $('#box'), msg = $('#msg');
  const setBlock = (t, retry) => {
    blocked = !!t; msg.hidden = !t;
    if (t) msg.innerHTML = `<div>${esc(t)}</div>` + (retry ? '<button onclick="location.reload()">Opnieuw proberen</button>' : '');
  };
  const KICK = 'Je bent door de docent uit de sessie verwijderd.';

  const write = async () => {
    if (blocked) return;
    if (wr) { pend = true; return; }
    wr = true;
    await sb.from('boards').update({ name, data: b, updated_at: new Date().toISOString() }).eq('code', code).eq('slide', slideId).eq('student', uid);
    wr = false; if (pend) { pend = false; write(); }
  };
  const save = () => { ls.s(bkey(slideId), b); clearTimeout(timer); timer = setTimeout(write, 600); };
  // Alle lagen van de groep (eigen laag live), gesorteerd zodat iedereen dezelfde stapeling ziet
  const layerList = () => Object.entries(others).map(([id, o]) => [id, o.data]).concat([[uid, b]]).sort((p, q) => p[0] < q[0] ? -1 : 1)
    .map(([id, d]) => mode === 'placemat' && myG
      ? { data: d, zone: ZORD[Math.max(0, myG.members.findIndex(m => m.id === id))], center: !!(sess && sess.reveal) } : { data: d });
  const matNames = () => { const n = []; if (myG) myG.members.forEach((m, i) => { n[ZORD[i]] = m.name; }); return n; };
  const redraw = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => render(cv, Math.min(4096, cv.clientWidth * (devicePixelRatio || 1) | 0),
    { dm: ENV.dm, bg: ENV.bg, img: ENV.img, mat: mode === 'placemat', names: matNames(), layers: layerList() })); };
  const fit = () => {
    const w = $('#wrap'), [dw, dh] = ENV.dm;
    const fx = w.scrollWidth ? (w.scrollLeft + w.clientWidth / 2) / w.scrollWidth : .5, fy = w.scrollHeight ? (w.scrollTop + w.clientHeight / 2) / w.scrollHeight : .5;

    w.scrollLeft = fx * w.scrollWidth - w.clientWidth / 2; w.scrollTop = fy * w.scrollHeight - w.clientHeight / 2;
  };
  addEventListener('resize', fit); fit();

  // Aanwezigheid: tabblad verlaten zien docenten als uitroepteken
  let ch = null, chSince = Date.now(), restart = null; // realtime-kanaal: wordt bij een hangende verbinding opnieuw opgebouwd
  let lastSent = null, lastInput = 0;
  // Weg = tabblad verborgen, of venster zonder focus (tenzij de leerling net op het bord klikte; sommige browsers melden focus te laat)
  const away = () => document.hidden || (!document.hasFocus() && Date.now() - lastInput > 4000);
  const chk = force => { // meldt de status alleen bij een wijziging, of altijd met force === true
    if (!ch || !joined || blocked) return;

    if (force !== true && lastSent === a) return;
    lastSent = a;
    Promise.resolve(ch.track({ name, away: a, ts: Date.now() })).then(r => { if (r && r !== 'ok') lastSent = null; }).catch(() => { lastSent = null; }); // mislukt? dan opnieuw proberen
  };
  const wake = () => { try { sb.realtime.connect(); } catch {} chk(); setTimeout(chk, 300); setTimeout(() => { chk(); if (restart && ch && ch.state !== 'joined') restart(); }, 1500); }; // terug: verbinding herstellen en status doorgeven

  setInterval(() => chk(), 1000);                          // vangnet: een gemist event herstelt binnen 1 seconde
  setInterval(() => { if (!away()) chk(true); }, 15000);   // levensteken: aanwezig blijven melden

  // Toegang controleren

  const { data: own } = await sb.from('boards').select('data').eq('code', code).eq('slide', slideId).eq('student', uid).maybeSingle();
  let closed = ses.closed, kicked = !!kk, hasBoard = !!own;
  timerEnd = ses.timer_end ? Date.parse(ses.timer_end) : null; frozen = !!ses.frozen_at;
  // Werkvorm gewisseld door de docent (epoch): oud bord weg
  const ek = 'wb_epoch_' + code, epochReset = (ls.g(ek) || 0) !== (ses.epoch || 0);
  if (epochReset) { b.s.length = 0; b.t.length = 0; ls.s(ek, ses.epoch || 0); ls.s(bkey(slideId), b); }

  const wipeKey = id => 'wb_wipe_' + code + '_' + id, wipeOf = (row, id) => (row.wipes || {})[id] || 0;
  const wipeReset = (ls.g(wipeKey(slideId)) || 0) !== wipeOf(ses, slideId);
  if (wipeReset) { b.s.length = 0; b.t.length = 0; ls.s(wipeKey(slideId), wipeOf(ses, slideId)); ls.s(bkey(slideId), b); }

  const grpOf = s => (s.groups || []).find(g => g.members.some(m => m.id === uid)) || null;
  const gsig = s => JSON.stringify([s.mode || 'individual', s.epoch || 0, (s.mode || 'individual') === 'individual' ? null : grpOf(s)]);
  const initSig = gsig(ses);
  sess = ses; mode = ses.mode || 'individual';
  myG = mode === 'individual' ? null : grpOf(ses);
  myZone = mode === 'placemat' && myG ? ZORD[myG.members.findIndex(m => m.id === uid)] : null;
  waiting = mode !== 'individual' && !myG;
  ENV.dm = DIM[mode] || DIM.individual; ENV.bg = sl0.cur.bg; ENV.img = null;
  if (mode !== 'individual') { $('#zm').hidden = false; $('#panb').hidden = false; }
  const setChips = () => {
    const c = $('#grp'); c.hidden = mode === 'individual';
    if (!myG) { c.innerHTML = '<b>⏳ Wacht op indeling door de docent</b>'; return; }
    c.innerHTML = `<b>${mode === 'placemat' ? '🧩 Placemat' : '👥 ' + esc(myG.name)}</b>` + myG.members.map(m => `<span class="bdg${m.id === uid ? ' me' : ''}">${esc(m.name)}</span>`).join('')
      + (mode === 'placemat' ? `<small>Jouw vak: ${ZNAME[myZone]}${sess && sess.reveal ? ' · vrijgegeven: het midden is voor iedereen' : ''}</small>` : '');
  };
  const loadOthers = async () => {
    others = {};
    if (mode !== 'individual' && myG) {
      const { data } = await sb.from('boards').select('student,data').eq('code', code).eq('slide', slideId).neq('student', uid);

  };
  let bgKey = '';
  const loadBg = async () => {

      bgKey = key;

  };
  const gotRow = r => { if (mode !== 'individual' && r.slide === slideId && r.student !== uid && r.data) { others[r.student] = { data: r.data }; redraw(); } };
  const setSlideUI = row => {
    const { list, cur: c0 } = slidesOf(row), n = $('#sn');
    n.hidden = list.length < 2; n.textContent = 'Slide ' + (list.indexOf(c0) + 1) + '/' + list.length;
  };
  const clearBoard = () => { clearTimeout(timer); b.s.length = 0; b.t.length = 0; ls.s(bkey(slideId), b); apply(); redraw(); };
  // De docent gaat naar een andere slide: bord, achtergrond en groepsgenoten wisselen mee (zonder de pagina te herladen)
  const switchSlide = async (id, row) => {
    switching = true;
    try {
      clearTimeout(timer); await write(); // oude slide eerst opslaan
      slideId = id; others = {}; ENV.img = null; bgKey = '';
      const loc = ls.g(bkey(id)); b.s = (loc && loc.s) || []; b.t = (loc && loc.t) || [];
      const { data: ex } = await sb.from('boards').select('data').eq('code', code).eq('slide', id).eq('student', uid).maybeSingle();
      hasBoard = !!ex;
      const wn = wipeOf(row, id);
      if ((ls.g(wipeKey(id)) || 0) !== wn) { ls.s(wipeKey(id), wn); b.s.length = 0; b.t.length = 0; ls.s(bkey(id), b); }

  const applySess = async row => {

    const cs = slidesOf(row).cur;
    if (cs.id !== slideId) { await switchSlide(cs.id, row); return; }
    const wn = wipeOf(row, slideId);
    if (wn !== (ls.g(wipeKey(slideId)) || 0)) { ls.s(wipeKey(slideId), wn); clearBoard(); }
    const rev = !sess || sess.reveal !== row.reveal, bgc = !sess || JSON.stringify(slidesOf(sess).cur.bg) !== JSON.stringify(cs.bg);
    sess = row; ENV.bg = cs.bg;

    if (bgc) loadBg();

  const refresh = () => sb.from('sessions').select('*').eq('code', code).maybeSingle().then(r => applySess(r.data));
  setChips(); setSlideUI(ses); fit(); loadBg(); loadOthers();

  // Verwijderd door de docent: melding, daarna terug naar het beginscherm om opnieuw in te voeren

  const ejected = async () => {

    setBlock(KICK + ' Je wordt doorgestuurd naar het beginscherm…');
    if (joined) { ch.untrack(); lastSent = null; }
    await sb.from('kicked').delete().eq('code', code).eq('student', uid); // opnieuw meedoen mag weer
    try { Object.keys(localStorage).filter(k => k.startsWith('wb_board_' + code) || k.startsWith('wb_wipe_' + code)).forEach(k => localStorage.removeItem(k)); localStorage.removeItem('wb_name_' + code); } catch {}
    setTimeout(() => { location.href = location.pathname; }, 2500);
  };

  // Bepaalt of de leerling mag tekenen; wordt aangeroepen bij elke wijziging van de sessie
  const apply = async () => {
    if (kicked) return ejected();
    if (closed) { setBlock('De docent heeft de sessie gesloten. Je kunt niet meer tekenen.'); if (joined) { ch.untrack(); lastSent = null; } return; }
    if (!hasBoard) {
      const { error } = await sb.from('boards').insert({ code, slide: slideId, student: uid, name, data: b });
      if (error && error.code !== '23505') return setBlock('Meedoen mislukt: ' + error.message, true);

    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sessions', filter: 'code=eq.' + code },

    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'boards', filter: 'code=eq.' + code }, p => gotRow(p.new))

  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * ENV.dm[0] | 0, (e.clientY - r.top) / r.height * ENV.dm[1] | 0]; };

}

/* ---------- Docent ---------- */
async function teacher(code) {
  const { data: ses } = await sb.from('sessions').select('*').eq('code', code).eq('owner', uid).maybeSingle();
  if (!ses) return fatal('Deze sessie bestaat niet of is van een andere docent/browser. <a href="./">Terug</a>');
  const st = { hide: ses.hide, shield: ses.shield, closed: ses.closed }, users = {}, els = {}, all = {}, seen = new Set();
  let online = {}, ready = false;
  let timerEnd = ses.timer_end ? Date.parse(ses.timer_end) : null, frozen = !!ses.frozen_at;
  const sl0 = slidesOf(ses);
  const cfg = { slides: sl0.list, cur: sl0.cur.id, wipes: ses.wipes || {}, bg: sl0.cur.bg, mode: ses.mode || 'individual', groups: ses.groups || [], reveal: !!ses.reveal, epoch: ses.epoch || 0 };

  const imgs = {}, BGN = { white: 'Wit', lines: 'Lijntjes', grid: 'Ruitjes', dots: 'Bullet journal', image: 'Afbeelding' };

  app.innerHTML = `<div class="tb"><a href="./" title="Terug naar je sessies">←</a><b>${esc(ses.name)}</b>
    <span class="code">${code}</span><button id="cp" title="Leerlinglink kopiëren">🔗 Link</button>
    <button id="h"></button><button id="sh"></button><button id="cl"></button><button id="fz">🔓</button><button id="gear" aria-label="Instellingen" title="Instellingen">⚙️</button><button id="rv" hidden></button>
    <span class="tm"><input id="tmin" type="number" min="0.5" step="0.5" max="180" value="${ls.g('wb_tmin') || 5}" title="Minuten"><button id="tgo">⏱ Start</button><span id="tpill" class="tpill" hidden></span><button id="tx" title="Timer wegklikken" hidden>✕</button></span>
    <span id="cnt"></span></div><div id="grid"></div>`;
  const grid = $('#grid');
  // Afschermen: tijdens de timer altijd, na de timer nooit, anders volgens de knop
  const running = () => timerEnd !== null && nowS() < timerEnd;
  const eff = () => timerEnd !== null ? running() : st.shield;

  // Vergroten van een wisbordje (blijft live meebewegen)
  let zoomId = null;

    }

    zoom.querySelector('.zn').textContent = st.hide ? '' : u.name;

  };
  const openZoom = id => { if (eff()) return; zoomId = id; zoom.hidden = false; zdraw(); };
  zoom.onclick = e => { if (e.target === zoom || e.target.classList.contains('zx')) closeZoom(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeZoom(); });

  const ui = () => {
    if (zoomId) { if (eff()) closeZoom(); else zdraw(); }
    grid.classList.toggle('hide', st.hide); grid.classList.toggle('shield', eff());
    $('#h').classList.toggle('on', st.hide); $('#h').textContent = '🙈 Namen'; $('#h').title = st.hide ? 'Namen tonen' : 'Namen verbergen';
    $('#sh').classList.toggle('on', st.shield); $('#sh').disabled = timerEnd !== null;

    fz.classList.toggle('on', frozen); fz.textContent = frozen ? '🔒' : '🔓'; fz.disabled = timerEnd !== null;

    if (!setm.hidden) rsoon();

  const push = () => { sb.from('sessions').update(st).eq('code', code).then(() => {}); ui(); };
  $('#h').onclick = () => { st.hide = !st.hide; push(); };

  $('#cp').onclick = () => {

  const hide = id => { if (zoomId === id) closeZoom(); delete users[id]; els[id] && els[id].remove(); delete els[id]; };
  const drop = id => { delete all[id]; seen.delete(id); hide(id); ui(); };

  if (!runStart) { runStart = nowS(); try { sessionStorage.setItem(runKey, String(runStart)); } catch {} }
  const sync = id => {
    const a = all[id]; if (!a) return;

  }
  const setU = r => { all[r.student] = { name: r.name, data: r.data, ts: r.updated_at }; sync(r.student); ui(); };

  // Timer
  let wasRun = running();
  const beep = () => {
    try {
      const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
      o.connect(g); g.connect(a.destination); o.frequency.value = 880;
      g.gain.setValueAtTime(.2, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + 1.2);
      o.start(); o.stop(a.currentTime + 1.2);
    } catch {}

  const tui = () => {

  $('#tgo').onclick = async () => {

  $('#fz').onclick = async () => { // alleen zonder timer: leerlingen kunnen het bord wel zien, niet wijzigen

  setInterval(tui, 300);

  // ===== Werkvorm-weergave: groepen en placemat op het dashboard =====
  const namesOf = g => { const n = []; if (!st.hide) g.members.forEach((m, i) => { n[ZORD[i]] = (all[m.id] && all[m.id].name) || m.name; }); return n; };
  const gOpts = g => ({
    dm: DIM[cfg.mode], bg: cfg.bg, img: bgImg, mat: cfg.mode === 'placemat', names: namesOf(g),
    layers: [...g.members].sort((p, q) => p.id < q.id ? -1 : 1).filter(m => seen.has(m.id) && all[m.id])
      .map(m => ({ data: all[m.id].data, zone: cfg.mode === 'placemat' ? ZORD[g.members.findIndex(q => q.id === m.id)] : null, center: true }))
  });
  const badge = (id, nm) => {

  };
  const gsoon = () => { if (!gt) gt = setTimeout(() => { gt = 0; gpaint(); }, 250); };
  function gpaint() {
    if (cfg.mode === 'individual') return;
    const inG = new Set(cfg.groups.flatMap(g => g.members.map(m => m.id)));
    const un = Object.keys(users).filter(id => !inG.has(id));
    const sig = cfg.mode + JSON.stringify(cfg.groups.map(g => [g.id, g.name])) + (un.length ? 1 : 0);
    if (sig !== gsigc) {
      gsigc = sig; grid.innerHTML = '';
      cfg.groups.forEach(g => {
        const el = document.createElement('div'); el.className = 'cd'; el.dataset.g = g.id;
        el.innerHTML = `<canvas></canvas><div class="ft"><b>${esc(g.name)}</b><button class="z" title="Vergroten">🔍</button></div><div class="bdgs"></div>`;
        el.querySelector('.z').onclick = () => openZoom(g.id);
        grid.append(el);
      });
      if (un.length) { const el = document.createElement('div'); el.className = 'cd'; el.dataset.u = '1'; el.innerHTML = '<div class="ft"><b>Niet ingedeeld</b></div><div class="bdgs"></div>'; grid.append(el); }
    }
    grid.querySelectorAll('.cd[data-g]').forEach(el => {
      const g = cfg.groups.find(q => q.id === el.dataset.g); if (!g) return;
      render(el.querySelector('canvas'), 400, gOpts(g));

    });
    const ue = grid.querySelector('[data-u] .bdgs'); if (ue) ue.innerHTML = un.map(id => badge(id, users[id].name)).join('');

  const saveCfg = async p => {

    const { error } = await sb.from('sessions').update(p).eq('code', code);
    if (error) alert('Opslaan mislukt: ' + error.message + ' (zijn alle update-scripts uitgevoerd in Supabase?)');
  };
  const repaintAll = () => {

    if (zoomId) zdraw();
  };
  const loadImg = async id => { // achtergrondafbeelding van een slide (met cache)

    if (!sl || sl.bg.type !== 'image') { delete imgs[id]; return null; }
    if (imgs[id] && imgs[id]._v === sl.bg.v) return imgs[id];

  };
  const loadCurImg = async () => { bgImg = ENV.img = await loadImg(cfg.cur); repaintAll(); };
  const applyMode = () => {

    $('#rv').hidden = cfg.mode !== 'placemat';
    $('#rv').textContent = cfg.reveal ? '🙈 Verbergen' : '👁 Vrijgeven'; $('#rv').title = cfg.reveal ? 'Placemat weer verbergen' : 'Placemat vrijgeven'; $('#rv').classList.toggle('on', cfg.reveal);
    if (cfg.mode === 'individual') Object.keys(all).forEach(sync); else gsoon();

  $('#rv').onclick = async () => { await saveCfg({ reveal: !cfg.reveal }); applyMode(); };

  // ===== Instellingen (modal): achtergrond, werkvorm, groepen =====
  const setm = document.createElement('div'); setm.id = 'set'; setm.hidden = true;
  setm.innerHTML = `<div class="sb">
    <div class="sh"><b>⚙️ Instellingen</b><button id="sx">✕ Sluiten</button></div>
    <h3>Slides</h3>
    <div id="slst"></div>
    <div class="pills"><button id="sladd">+ Slide</button><button id="slexp" title="Slides en achtergronden opslaan als bestand">⬇ Exporteren</button>
      <label class="filebtn">⬆ Importeren…<input type="file" id="slimp" accept=".json,application/json" hidden></label>
      <select id="slmode"><option value="replace">Slides vervangen</option><option value="add">Toevoegen</option></select></div>
    <small>Een export bevat alleen het aantal slides en de achtergronden, geen aantekeningen van leerlingen.</small>
    <h3 id="bgh">Achtergrond</h3>
    <div class="pills" id="bgp"><button data-bg="white">Wit</button><button data-bg="lines">Lijntjes</button><button data-bg="grid">Ruitjes 1×1 cm</button><button data-bg="dots">Bullet journal</button>
      <label class="filebtn" id="bgl">🖼️ Afbeelding…<input type="file" id="bgf" accept="image/*" hidden></label></div>
    <div id="bgimg" hidden><canvas id="bgprev"></canvas>
      <div class="row"><span>Zoom</span><input id="bgz" type="range" min="0.2" max="3" step="0.01" value="1"><button id="bgfit" title="De hele afbeelding in beeld">Passend</button><button id="bgfill" title="Het hele bord vullen">Vullen</button><button id="bgok" class="on">Toepassen</button></div>
      <small>Sleep de afbeelding om hem te verplaatsen. De preview heeft de verhouding van het wisbordje.</small></div>
    <h3>Werkvorm</h3>
    <div class="pills" id="modep"><button data-m="individual">Individueel</button><button data-m="groups">Break-out groepen</button><button data-m="placemat">Placemat</button></div>
    <div id="grpset" hidden>
      <div class="row"><select id="rmode"><option value="per">Leerlingen per groep</option><option value="n">Aantal groepen</option></select><input id="rnum" type="number" min="1" max="30" value="4"><button id="rgo" class="on">🎲 Willekeurig indelen</button></div>
      <div class="row"><button id="gadd">+ Groep</button><small>Klik op een leerling en daarna op een groep (of op "Niet ingedeeld") om te verplaatsen.</small></div>
      <div id="gedit"></div></div></div>`;
  document.body.append(setm);
  let pend = null, dragp = null;

  // zoom 1 = bord gevuld; kleiner dan 1 laat de hele afbeelding zien (staande foto op liggend bord)
  const zminOf = im => { const a = DIM.individual[0] / im.width, c = DIM.individual[1] / im.height; return Math.min(a, c) / Math.max(a, c); };
  const setZ = v => { pend.z = v; $('#bgz').value = v; prev(); };

    const num = Math.max(1, parseInt($('#rnum').value) || 1);
    let G = $('#rmode').value === 'per' ? Math.ceil(n / num) : Math.min(num, n);
    if (cfg.mode === 'placemat') G = Math.min(Math.max(G, Math.ceil(n / 4)), Math.max(1, n >> 1)); // 2-4 per placemat
    const gs = Array.from({ length: G }, (_, i) => ({ id: 'g' + rnd(5), name: 'Groep ' + (i + 1), members: [] }));
    ids.forEach((id, i) => gs[i % G].members.push({ id, name: users[id].name }));
    await saveCfg({ groups: gs }); renderSet(); gsoon();
  };
  const renderSet = () => {
    const eSl = cfg.slides.find(q => q.id === editId) || cfg.slides[0], eb = eSl.bg;
    $('#bgh').textContent = 'Achtergrond van slide ' + (cfg.slides.indexOf(eSl) + 1);
    setm.querySelectorAll('[data-bg]').forEach(b => b.classList.toggle('on', eb.type === b.dataset.bg));
    $('#bgl').classList.toggle('on', eb.type === 'image');
    $('#slst').innerHTML = cfg.slides.map((q, i) => `<div class="slr${q.id === editId ? ' edit' : ''}" data-sl="${q.id}"><canvas></canvas>
      <span class="sln"><span><b>Slide ${i + 1}</b>${q.id === cfg.cur ? '<em>live</em>' : ''}</span><small>${BGN[q.bg.type] || ''}</small></span>
      <span class="slb"><button data-live="${q.id}" title="Nu aan de leerlingen tonen">▶</button><button data-up="${q.id}" title="Naar voren">▲</button><button data-dn="${q.id}" title="Naar achteren">▼</button><button data-sdel="${q.id}" title="Slide verwijderen">🗑</button></span></div>`).join('');
    $('#slst').querySelectorAll('[data-sl]').forEach(el => { const q = cfg.slides.find(x => x.id === el.dataset.sl); render(el.querySelector('canvas'), 96, { dm: DIM.individual, bg: q.bg, img: imgs[q.id], layers: [] }); });
    setm.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', cfg.mode === b.dataset.m));
    $('#grpset').hidden = cfg.mode === 'individual';
    if (cfg.mode === 'individual') return;
    $('#rnum').max = cfg.mode === 'placemat' ? 4 : 30;
    const inG = new Set(cfg.groups.flatMap(g => g.members.map(m => m.id)));
    const chip = (id, nm) => `<span class="bdg${gsel === id ? ' pick' : ''}" data-id="${id}">${esc(nm)}<i data-kick="${id}" title="Uit de sessie verwijderen">✕</i></span>`;
    $('#gedit').innerHTML = '<div class="gc" data-to=""><b>Niet ingedeeld</b>' + Object.keys(users).filter(id => !inG.has(id)).map(id => chip(id, users[id].name)).join('') + '</div>'
      + cfg.groups.map(g => `<div class="gc" data-to="${g.id}"><b>${esc(g.name)}</b>${g.members.map(m => chip(m.id, (all[m.id] && all[m.id].name) || m.name)).join('')}<i data-del="${g.id}" title="Groep verwijderen">🗑</i></div>`).join('');
  };
  let rt = 0; const rsoon = () => { clearTimeout(rt); rt = setTimeout(renderSet, 400); };
  $('#gedit').onclick = async e => {
    const k = e.target.closest('[data-kick]'); if (k) return kickStudent(k.dataset.kick);
    const d = e.target.closest('[data-del]'); if (d) { await saveCfg({ groups: cfg.groups.filter(g => g.id !== d.dataset.del) }); renderSet(); gsoon(); return; }
    const c = e.target.closest('[data-id]'); if (c) { gsel = gsel === c.dataset.id ? null : c.dataset.id; renderSet(); return; }
    const t = e.target.closest('[data-to]'); if (t && gsel) { const id = gsel; gsel = null; await moveTo(id, t.dataset.to); renderSet(); }
  };
  // ===== Slides: navigeren, beheren, exporteren/importeren, alle bordjes wissen =====
  const loadRows = async () => {
    const { data: rows } = await sb.from('boards').select('student,name,data,updated_at').eq('code', code).eq('slide', cfg.cur);
    (rows || []).forEach(setU); ui();
  };
  const pg = document.createElement('div'); pg.id = 'pager';
  pg.innerHTML = '<button id="pp" title="Vorige slide (←)">◀</button><span id="pn"></span><button id="pnx" title="Volgende slide (→)">▶</button><span class="pgs"></span><button id="pwipe" title="Alle wisbordjes op deze slide wissen">🧹</button>';
  document.body.append(pg);
  const pager = () => {
    const i = cfg.slides.findIndex(q => q.id === cfg.cur);
    $('#pn').textContent = 'Slide ' + (i + 1) + ' / ' + cfg.slides.length;
    $('#pp').disabled = i <= 0; $('#pnx').disabled = i >= cfg.slides.length - 1;
  };
  const curChanged = async () => {
    const sl = cfg.slides.find(q => q.id === cfg.cur) || cfg.slides[0];
    cfg.bg = sl.bg; ENV.bg = sl.bg; bgImg = ENV.img = null;
    Object.keys(all).forEach(k => { delete all[k]; delete users[k]; }); seen.clear();
    Object.keys(els).forEach(k => delete els[k]); grid.innerHTML = ''; gsigc = ''; if (zoomId) closeZoom();
    pager(); loadCurImg(); await loadRows(); applyMode();
  };
  const goSlide = async id => { if (id === cfg.cur || !cfg.slides.some(q => q.id === id)) return; await saveCfg({ cur: id }); await curChanged(); renderSet(); };
  const step = d => { const i = cfg.slides.findIndex(q => q.id === cfg.cur) + d; if (i >= 0 && i < cfg.slides.length) goSlide(cfg.slides[i].id); };
  $('#pp').onclick = () => step(-1); $('#pnx').onclick = () => step(1);
  document.addEventListener('keydown', e => {
    if (!setm.hidden || !zoom.hidden || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) return;
    if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1);
  });
  $('#pwipe').onclick = async () => { // alle bordjes van alle leerlingen op deze slide wissen
    if (!confirm('Alle wisbordjes van alle leerlingen op deze slide wissen?')) return;
    // Alleen de inhoud wissen: de bordjes blijven in het raster staan
    const { error } = await sb.from('boards').update({ data: { s: [], t: [] } }).eq('code', code).eq('slide', cfg.cur);
    if (error) return alert('Wissen mislukt: ' + error.message + ' (is update-wissen.sql uitgevoerd in Supabase?)');
    await saveCfg({ wipes: { ...cfg.wipes, [cfg.cur]: (cfg.wipes[cfg.cur] || 0) + 1 } });
    const now = new Date().toISOString();
    Object.keys(all).forEach(k => { all[k] = { ...all[k], data: { s: [], t: [] }, ts: now }; sync(k); });
    gsoon(); ui();
  };
  const showEditBg = async () => {
    pend = null; $('#bgimg').hidden = true;
    const sl = cfg.slides.find(q => q.id === editId);
    if (sl && sl.bg.type === 'image') {
      const im = await loadImg(editId);
      if (im) { pend = { img: im, data: null, z: sl.bg.z || 1, x: sl.bg.x || 0, y: sl.bg.y || 0 }; $('#bgz').min = Math.max(.1, Math.min(1, pend.z, zminOf(im) * .5)); $('#bgz').value = pend.z; $('#bgimg').hidden = false; prev(); }
    }
  };
  const moveSlide = async (id, d) => {
    const a = [...cfg.slides], i = a.findIndex(q => q.id === id), j = i + d;
    if (j < 0 || j >= a.length) return;
    [a[i], a[j]] = [a[j], a[i]]; await saveCfg({ slides: a }); pager(); renderSet();
  };
  const delSlide = async id => {
    if (cfg.slides.length < 2) return alert('Er moet minstens één slide overblijven.');
    if (!confirm('Deze slide en alle bordjes erop verwijderen?')) return;
    const idx = cfg.slides.findIndex(q => q.id === id), slides = cfg.slides.filter(q => q.id !== id), wasCur = id === cfg.cur;
    await sb.from('boards').delete().eq('code', code).eq('slide', id);
    await sb.from('bgimages').delete().eq('code', code).eq('slide', id);
    const wipes = { ...cfg.wipes }; delete wipes[id]; delete imgs[id];
    const p = { slides, wipes }; if (wasCur) p.cur = slides[Math.min(idx, slides.length - 1)].id;
    await saveCfg(p);
    if (editId === id) editId = cfg.cur;
    if (wasCur) await curChanged();
    await showEditBg(); pager(); renderSet();
  };
  $('#sladd').onclick = async () => {
    const n = { id: newId(), bg: { type: 'white' } };
    await saveCfg({ slides: [...cfg.slides, n] }); editId = n.id; await showEditBg(); pager(); renderSet();
  };
  $('#slst').onclick = async e => {
    const row = e.target.closest('[data-sl]'); if (!row) return;
    const id = row.dataset.sl, t = e.target.closest('button');
    if (t && t.dataset.live) return goSlide(id);
    if (t && t.dataset.up) return moveSlide(id, -1);
    if (t && t.dataset.dn) return moveSlide(id, 1);
    if (t && t.dataset.sdel) return delSlide(id);
    editId = id; await showEditBg(); renderSet();
  };
  // Exporteren: alleen aantal slides + achtergronden (geen leerlingwerk)
  $('#slexp').onclick = async () => {
    const out = [];
    for (const q of cfg.slides) {
      const o = { bg: { ...q.bg } }; delete o.bg.v;
      if (q.bg.type === 'image') {
        const { data } = await sb.from('bgimages').select('data').eq('code', code).eq('slide', q.id).maybeSingle();
        if (data) o.image = data.data; else o.bg = { type: 'white' };
      }
      out.push(o);
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'wisbordjes', version: 1, slides: out })], { type: 'application/json' }));
    a.download = 'wisbordjes-slides-' + String(ses.name || code).replace(/[^\w-]+/g, '_') + '.json';
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  };
  $('#slimp').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    let d; try { d = JSON.parse(await f.text()); } catch { return alert('Dit is geen geldig bestand.'); }
    if (!d || d.app !== 'wisbordjes' || !Array.isArray(d.slides) || !d.slides.length) return alert('Dit bestand bevat geen wisbordjes-slides.');
    const replace = $('#slmode').value === 'replace';
    if (replace && !confirm('De huidige slides en alle bordjes vervangen door de ' + d.slides.length + ' geïmporteerde slides?')) return;
    const okT = ['white', 'lines', 'grid', 'dots', 'image'], add = [];
    for (const x of d.slides.slice(0, 50)) {
      const xb = (x && x.bg) || {}, t = okT.includes(xb.type) ? xb.type : 'white', n = { id: newId(), bg: { type: t } };
      if (t === 'image') {
        if (typeof x.image === 'string' && x.image.startsWith('data:image/') && x.image.length < 1900000) {
          const { error } = await sb.from('bgimages').upsert({ code, slide: n.id, data: x.image });
          if (error) { alert('Een afbeelding importeren mislukte: ' + error.message); n.bg = { type: 'white' }; }
          else n.bg = { type: 'image', z: Math.min(3, Math.max(.1, +xb.z || 1)), x: Number.isFinite(+xb.x) ? +xb.x : 0, y: Number.isFinite(+xb.y) ? +xb.y : 0, v: Date.now() };
        } else n.bg = { type: 'white' };
      }
      add.push(n);
    }
    if (replace) {
      const old = cfg.slides.map(q => q.id);
      await sb.from('boards').delete().eq('code', code).in('slide', old);
      await sb.from('bgimages').delete().eq('code', code).in('slide', old);
      Object.keys(imgs).forEach(k => delete imgs[k]);
      await saveCfg({ slides: add, cur: add[0].id, wipes: {} }); editId = cfg.cur;
      await curChanged();
    } else {
      await saveCfg({ slides: [...cfg.slides, ...add] }); editId = add[0].id;
    }
    await showEditBg(); pager(); renderSet();
  };
  const openSet = async () => {
    setm.hidden = false; editId = cfg.cur;
    renderSet(); await Promise.all(cfg.slides.filter(q => q.bg.type === 'image').map(q => loadImg(q.id)));
    await showEditBg(); renderSet();
  };
  $('#gear').onclick = openSet;
  setm.onclick = e => { if (e.target === setm || e.target.id === 'sx') setm.hidden = true; };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setm.hidden = true; });
  loadCurImg(); applyMode(); pager();

  await loadRows();

  // Realtime-kanaal (aanwezigheid + live borden); wordt opnieuw opgebouwd als de verbinding blijft hangen
  let ch = null, chSince = Date.now();
  const connUI = ok => { $('#cnt').classList.toggle('bad', !ok); };
  const startCh = () => {
    if (ch) { try { sb.removeChannel(ch); } catch {} }
    chSince = Date.now();
    const c = ch = sb.channel('wb:' + code);
    c.on('presence', { event: 'sync' }, () => {
      if (c !== ch) return;
      online = {}; const s = c.presenceState();
      for (const k in s) online[k] = s[k].reduce((a, m) => (m.ts || 0) >= (a.ts || 0) ? m : a); // nieuwste melding wint (ook bij meerdere tabbladen/verbindingen)
      ready = true; Object.keys(all).forEach(sync); gsoon(); ui();
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'boards', filter: 'code=eq.' + code }, p => { if (p.new.slide === cfg.cur) setU(p.new); })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'boards', filter: 'code=eq.' + code }, p => { if (p.new.slide === cfg.cur) setU(p.new); })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'boards' }, p => { if (p.old && p.old.code === code && (!p.old.slide || p.old.slide === cfg.cur)) drop(p.old.student); })
    .subscribe(st => { if (st === 'SUBSCRIBED') { chSince = Date.now(); connUI(true); loadRows(); } else connUI(false); });
  };
  startCh();
  setInterval(() => {
    if (ch.state === 'joined') { chSince = Date.now(); connUI(true); return; }
    connUI(false);
    if (Date.now() - chSince > (document.visibilityState === 'visible' ? 8000 : 20000)) startCh();
  }, 3000);
  // Terug op dit tabblad: verbinding herstellen en gemiste wijzigingen ophalen
  const wakeT = () => { try { sb.realtime.connect(); } catch {} if (document.visibilityState === 'visible') { loadRows(); setTimeout(() => { if (ch.state !== 'joined') startCh(); }, 1500); } };
  document.addEventListener('visibilitychange', wakeT); addEventListener('focus', wakeT); addEventListener('online', wakeT);
}

start();
</script>
</body>
</html>
