<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wisbordjes</title>
<style>
:root{--bg:#f4f5f7;--fg:#1f2430;--card:#fff;--bd:#d9dce3;--ac:#2563eb;--red:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#171a21;--fg:#e8eaf0;--card:#232733;--bd:#3a4050}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
button,input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
button{cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
a{color:var(--ac)}
.c{max-width:520px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:16px 0;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* leerling */
.st{height:100dvh;display:flex;flex-direction:column}
.bar{display:flex;gap:6px;align-items:center;padding:8px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--bd)}
.bar input[type=color]{padding:0;width:40px;height:38px}
.bar .sp{flex:1}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
#box{position:relative;box-shadow:0 2px 12px #0003}
#cv{display:block;background:#fff;touch-action:none;cursor:crosshair}
#box textarea{position:absolute;margin:0;padding:0;border:1px dashed #888;background:#fff8;color:#000;resize:none;outline:none;overflow:hidden;font-family:sans-serif;line-height:1.2}
[hidden]{display:none!important}
#msg{position:fixed;inset:0;background:#000b;color:#fff;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px}
/* docent */
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.code{font-weight:700;font-size:1.2em;letter-spacing:.1em;background:var(--bg);padding:4px 10px;border-radius:8px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:12px}
.cd{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.cd canvas{display:block;width:100%;background:#fff}
.cd .ft{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;gap:6px}
.cd .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd .x{padding:2px 8px}
.cd.off canvas{opacity:.35}
.warn{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:20px;display:none;align-items:center;justify-content:center}
.cd.away .warn{display:flex}
.hide .nm{visibility:hidden}
.shield canvas{visibility:hidden}
.shield .cd{min-height:150px}
.shield .cd::after{content:"Afgeschermd";position:absolute;top:40%;left:0;right:0;text-align:center;opacity:.6}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const W = 1200, H = 700;
const $ = s => document.querySelector(s), app = $('#app');
const ls = {
  g: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  s: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const rnd = n => Array.from({ length: n }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random() * 32 | 0]).join('');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Tekent een bord (strokes + teksten) op een canvas met pixelbreedte w
function draw(cv, b, w) {
  const sc = w / W; cv.width = w; cv.height = Math.round(H * sc);
  const x = cv.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height);
  x.scale(sc, sc); x.lineCap = x.lineJoin = 'round';
  for (const s of b.s) {
    const hl = s.m === 'hl', p = s.p;
    x.globalCompositeOperation = hl ? 'multiply' : 'source-over';
    x.globalAlpha = hl ? .4 : 1;
    x.strokeStyle = s.m === 'er' ? '#fff' : s.c; x.lineWidth = s.w;
    x.beginPath(); x.moveTo(p[0], p[1]);
    if (p.length < 4) x.lineTo(p[0] + .1, p[1]);
    for (let i = 2; i < p.length; i += 2) x.lineTo(p[i], p[i + 1]);
    x.stroke();
  }
  x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  for (const t of b.t) {
    x.fillStyle = t.c; x.font = t.s + 'px sans-serif'; x.textBaseline = 'top';
    t.v.split('\n').forEach((l, i) => x.fillText(l, t.x, t.y + i * t.s * 1.2));
  }
}

// ====== INSTELLEN: kopieer deze twee waarden uit Supabase (Project Settings > API) ======
const SUPABASE_URL = 'https://mrntifcakwmwdlywaqgt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ji_-mqWB7EFTtvxxS3xTKA_XJNSEX1D';
// ===========================================================================================

const sb = (typeof supabase !== 'undefined' && !SUPABASE_URL.includes('JOUW-')) ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const qs = new URLSearchParams(location.search);
const cleanCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
const fatal = t => { app.innerHTML = `<div class="c"><div class="card">${t}</div></div>`; };
let uid = null;

async function start() {
  if (!sb) return fatal('Vul eerst <b>SUPABASE_URL</b> en <b>SUPABASE_KEY</b> in bovenin index.html in.');
  let { data: { session } } = await sb.auth.getSession();
  if (!session) {
    const r = await sb.auth.signInAnonymously();
    if (r.error) return fatal('Inloggen mislukt: ' + esc(r.error.message) + '<br>Staat anoniem inloggen aan in Supabase en is de limiet niet bereikt?');
    session = r.data.session;
  }
  uid = session.user.id;
  if (qs.get('s')) return student(cleanCode(qs.get('s')));
  if (qs.get('t')) return teacher(cleanCode(qs.get('t')));
  home();
}

/* ---------- Startpagina ---------- */
async function home() {
  app.innerHTML = `<div class="c"><h1>Wisbordjes</h1>
  <div class="card"><h2>Leerling</h2>
    <input id="n" placeholder="Je naam" maxlength="30">
    <input id="k" placeholder="Sessiecode" maxlength="8" style="text-transform:uppercase">
    <button id="go" class="on">Meedoen</button></div>
  <div class="card"><h2>Docent</h2>
    <div class="row"><input id="sn" placeholder="Naam sessie, bijv. klas 2A"><button id="new" class="on">Start sessie</button></div>
    <div id="list">Laden…</div></div></div>`;
  const n = $('#n'), k = $('#k');
  k.oninput = () => { const v = ls.g('wb_name_' + cleanCode(k.value)); if (v) n.value = v; };
  $('#go').onclick = () => {
    const c = cleanCode(k.value), nm = n.value.trim();
    if (!c || !nm) return;
    ls.s('wb_name_' + c, nm); location.href = '?s=' + c;
  };
  $('#new').onclick = async () => {
    const name = $('#sn').value.trim() || 'Nieuwe sessie';
    for (let i = 0; i < 5; i++) {
      const code = rnd(5), { error } = await sb.from('sessions').insert({ code, name });
      if (!error) return location.href = '?t=' + code;
      if (error.code !== '23505') return alert('Sessie maken mislukt: ' + error.message);
    }
  };
  const { data } = await sb.from('sessions').select('code,name').eq('owner', uid).order('created_at', { ascending: false });
  $('#list').innerHTML = (data || []).map(s => `<div class="item"><a href="?t=${s.code}">${esc(s.name)} <small>(${s.code})</small></a><button data-d="${s.code}">Verwijder</button></div>`).join('') || '<small>Nog geen sessies.</small>';
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {
    if (!confirm('Sessie en alle wisbordjes definitief verwijderen?')) return;
    await sb.from('sessions').delete().eq('code', b.dataset.d); home();
  });
}

/* ---------- Leerling ---------- */
async function student(code) {
  const name = ls.g('wb_name_' + code);
  if (!name) {
    app.innerHTML = `<div class="c"><div class="card"><h2>Sessie ${esc(code)}</h2><input id="n" placeholder="Je naam" maxlength="30"><button id="go" class="on">Meedoen</button></div></div>`;
    $('#go').onclick = () => { const v = $('#n').value.trim(); if (v) { ls.s('wb_name_' + code, v); student(code); } };
    return;
  }
  const b = ls.g('wb_board_' + code) || { s: [], t: [] };
  let tool = 'pen', color = '#111111', sz = 6, cur = null, timer = 0, sc = 1, raf = 0;
  let blocked = true, wr = false, pend = false, joined = false;

  app.innerHTML = `<div class="st"><div class="bar">
    <button data-t="pen" class="on">✏️ Pen</button><button data-t="hl">🖍️ Marker</button>
    <button data-t="er">🧽 Gum</button><button data-t="tx">🔤 Tekst</button>
    <input type="color" id="col" value="#111111">
    <select id="sz"><option value="3">Dun</option><option value="6" selected>Middel</option><option value="12">Dik</option></select>
    <button id="undo">↶</button><button id="clr">Alles wissen</button>
    <span class="sp"></span><small>${esc(name)} · ${esc(code)}</small></div>
    <div id="wrap"><div id="box"><canvas id="cv"></canvas></div></div></div>
    <div id="msg">Verbinden…</div>`;
  const cv = $('#cv'), box = $('#box'), msg = $('#msg');
  const setBlock = (t, retry) => {
    blocked = !!t; msg.hidden = !t;
    if (t) msg.innerHTML = `<div>${esc(t)}</div>` + (retry ? '<button onclick="location.reload()">Opnieuw proberen</button>' : '');
  };
  const KICK = 'Je bent door de docent uit de sessie verwijderd.';

  const write = async () => {
    if (blocked) return;
    if (wr) { pend = true; return; }
    wr = true;
    await sb.from('boards').update({ name, data: b, updated_at: new Date().toISOString() }).eq('code', code).eq('student', uid);
    wr = false; if (pend) { pend = false; write(); }
  };
  const save = () => { ls.s('wb_board_' + code, b); clearTimeout(timer); timer = setTimeout(write, 600); };
  const redraw = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => draw(cv, b, cv.clientWidth * (devicePixelRatio || 1) | 0)); };
  const fit = () => {
    const w = $('#wrap'); sc = Math.max(.1, Math.min((w.clientWidth - 16) / W, (w.clientHeight - 16) / H));
    cv.style.width = W * sc + 'px'; cv.style.height = H * sc + 'px'; redraw();
  };
  addEventListener('resize', fit); fit();

  // Aanwezigheid: tabblad verlaten zien docenten als uitroepteken
  const ch = sb.channel('wb:' + code, { config: { presence: { key: uid } } });
  const away = () => document.hidden || !document.hasFocus();
  const chk = () => joined && ch.track({ name, away: away() });
  document.addEventListener('visibilitychange', chk); addEventListener('blur', chk); addEventListener('focus', chk); addEventListener('pagehide', () => joined && ch.track({ name, away: true }));

  // Toegang controleren
  const { data: ses } = await sb.from('sessions').select('code,closed').eq('code', code).maybeSingle();
  if (!ses) return setBlock('Deze sessie bestaat niet (of de verbinding mislukte).', true);
  const { data: kk } = await sb.from('kicked').select('student').eq('code', code).eq('student', uid).maybeSingle();
  if (kk) return setBlock(KICK);
  const { data: own } = await sb.from('boards').select('data').eq('code', code).eq('student', uid).maybeSingle();
  if (!own) {
    if (ses.closed) return setBlock('De sessie is gesloten voor nieuwe leerlingen.', true);
    const { error } = await sb.from('boards').insert({ code, student: uid, name, data: b });
    if (error) return setBlock('Meedoen mislukt: ' + error.message, true);
  } else if (!b.s.length && !b.t.length && own.data) { // lokaal leeg (bv. andere browser): haal serverbord op
    Object.assign(b, own.data); b.s = b.s || []; b.t = b.t || []; redraw();
  }
  setBlock(null);
  if (own) write();

  ch.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'kicked', filter: 'code=eq.' + code },
    p => { if (p.new.student === uid) setBlock(KICK); })
    .subscribe(s => { if (s === 'SUBSCRIBED') { joined = true; chk(); } });

  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W | 0, (e.clientY - r.top) / r.height * H | 0]; };
  cv.onpointerdown = e => {
    e.preventDefault();
    const [x, y] = pos(e);
    if (tool === 'tx') return addText(x, y);
    cur = { m: tool, c: color, w: tool === 'hl' ? sz * 4 : tool === 'er' ? sz * 5 : sz, p: [x, y] };
    b.s.push(cur); cv.setPointerCapture(e.pointerId); redraw();
  };
  cv.onpointermove = e => {
    if (!cur) return;
    const [x, y] = pos(e), p = cur.p;
    if (Math.abs(x - p[p.length - 2]) + Math.abs(y - p[p.length - 1]) < 3) return;
    p.push(x, y); redraw();
  };
  cv.onpointerup = cv.onpointercancel = () => { if (cur) { cur = null; save(); } };

  function addText(x, y) {
    const fs = sz * 4 + 12, ta = document.createElement('textarea');
    ta.style.cssText = `left:${x * sc}px;top:${y * sc}px;font-size:${fs * sc}px;color:${color};width:${300 * sc}px;height:${fs * 1.3 * sc}px`;
    ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
    ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ta.blur(); } };
    ta.onblur = () => {
      const v = ta.value.trim(); ta.remove();
      if (v) { b.t.push({ x, y, s: fs, c: color, v }); redraw(); save(); }
    };
    box.append(ta); setTimeout(() => ta.focus(), 0);
  }
  document.querySelectorAll('[data-t]').forEach(btn => btn.onclick = () => {
    tool = btn.dataset.t;
    document.querySelectorAll('[data-t]').forEach(o => o.classList.toggle('on', o === btn));
    cv.style.cursor = tool === 'tx' ? 'text' : 'crosshair';
  });
  $('#col').oninput = e => color = e.target.value;
  $('#sz').onchange = e => sz = +e.target.value;
  $('#undo').onclick = () => { (b.s.length ? b.s : b.t).pop(); redraw(); save(); };
  $('#clr').onclick = () => { if (confirm('Je hele wisbordje wissen?')) { b.s.length = 0; b.t.length = 0; redraw(); save(); } };
}

/* ---------- Docent ---------- */
async function teacher(code) {
  const { data: ses } = await sb.from('sessions').select('*').eq('code', code).eq('owner', uid).maybeSingle();
  if (!ses) return fatal('Deze sessie bestaat niet of is van een andere docent/browser. <a href="./">Terug</a>');
  const st = { hide: ses.hide, shield: ses.shield, closed: ses.closed }, users = {}, els = {};
  let online = {}, ready = false;

  app.innerHTML = `<div class="tb"><a href="./">← Sessies</a><b>${esc(ses.name)}</b>
    <span class="code">${code}</span><button id="cp">Link kopiëren</button>
    <button id="h"></button><button id="sh"></button><button id="cl"></button><span id="cnt"></span></div><div id="grid"></div>`;
  const grid = $('#grid');
  const ui = () => {
    grid.classList.toggle('hide', st.hide); grid.classList.toggle('shield', st.shield);
    $('#h').classList.toggle('on', st.hide); $('#h').textContent = st.hide ? 'Namen tonen' : 'Namen verbergen';
    $('#sh').classList.toggle('on', st.shield); $('#sh').textContent = st.shield ? 'Wisbordjes tonen' : 'Wisbordjes afschermen';
    $('#cl').classList.toggle('on', st.closed); $('#cl').textContent = st.closed ? 'Sessie openen' : 'Sessie sluiten';
    const n = Object.keys(users).length; $('#cnt').textContent = n + ' leerling' + (n === 1 ? '' : 'en');
  };
  const push = () => { sb.from('sessions').update(st).eq('code', code).then(() => {}); ui(); };
  $('#h').onclick = () => { st.hide = !st.hide; push(); };
  $('#sh').onclick = () => { st.shield = !st.shield; push(); };
  $('#cl').onclick = () => { st.closed = !st.closed; push(); };
  $('#cp').onclick = () => {
    try { navigator.clipboard.writeText(location.origin + location.pathname + '?s=' + code); } catch {}
    $('#cp').textContent = 'Gekopieerd!'; setTimeout(() => $('#cp').textContent = 'Link kopiëren', 1500);
  };

  const drop = id => { delete users[id]; els[id] && els[id].remove(); delete els[id]; ui(); };
  function upd(id) {
    const u = users[id]; if (!u) return;
    let el = els[id];
    if (!el) {
      el = els[id] = document.createElement('div'); el.className = 'cd';
      el.innerHTML = '<canvas></canvas><div class="warn">!</div><div class="ft"><span class="nm"></span><button class="x" title="Verwijder leerling">✕</button></div>';
      el.querySelector('.x').onclick = async () => {
        if (!confirm(users[id].name + ' verwijderen uit de sessie?')) return;
        await sb.from('kicked').insert({ code, student: id });
        await sb.from('boards').delete().eq('code', code).eq('student', id);
        drop(id);
      };
      grid.append(el);
    }
    const o = online[id];
    el.querySelector('.nm').textContent = u.name;
    el.classList.toggle('off', ready && !o);
    el.classList.toggle('away', ready && (!o || o.away));
    el.querySelector('.warn').title = o ? 'Leerling heeft het tabblad verlaten' : 'Leerling is offline';
    if (el._ts !== u.ts) { el._ts = u.ts; draw(el.querySelector('canvas'), { s: [], t: [], ...u.data }, 400); }
  }
  const setU = r => { users[r.student] = { name: r.name, data: r.data, ts: r.updated_at }; upd(r.student); ui(); };

  const { data: rows } = await sb.from('boards').select('student,name,data,updated_at').eq('code', code);
  (rows || []).forEach(setU);
  ui();

  const ch = sb.channel('wb:' + code);
  ch.on('presence', { event: 'sync' }, () => {
    online = {}; const s = ch.presenceState();
    for (const k in s) online[k] = s[k][s[k].length - 1];
    ready = true; Object.keys(users).forEach(upd);
  })
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'boards', filter: 'code=eq.' + code }, p => setU(p.new))
  .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'boards', filter: 'code=eq.' + code }, p => setU(p.new))
  .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'boards' }, p => { if (p.old && p.old.code === code) drop(p.old.student); })
  .subscribe();
}

start();
</script>
</body>
</html>
